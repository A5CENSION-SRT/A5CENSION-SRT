name: profile-stats

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PROFILE_STATS_TOKEN: a personal access token with read:user and repo scopes,
      # stored as a repository secret. It lets the script count private contributions.
      - name: Build assets
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python scripts/build.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile stats"
            git push
          fi
